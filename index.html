<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orthohedra</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="https://vorth.github.io/design-app/module/index.js"></script>
</head>
<body>
  <design-app
    app-title="Orthohedra"
    file-extension=".json"
    file-description="Orthohedra design"
    file-mime="application/json"
    autosave-key="cubes-editor:state"
  >
    <div id="viewport">
      <div id="modeOverlay">
        <div class="modes">
          <button class="mode-btn active" data-mode="cubes" id="cubesBtn">Cubes</button>
          <button class="mode-btn" data-mode="graph" id="graphBtn">Graph</button>
        </div>
      </div>
    </div>

    <div slot="info">
      <p id="status">Mode: Cubes<br>Cubes: 1</p>
      <p id="skeletonStats"></p>
    </div>
  </design-app>

  <div id="error"></div>

  <div id="busyOverlay" hidden>
    <div id="busyBox">
      <span id="busyLabel">Realizing…</span>
      <button class="mode-btn" id="cancelBusyBtn">Cancel</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
